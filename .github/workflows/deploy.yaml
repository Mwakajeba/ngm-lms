name: Deploy Laravel to Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 161.97.75.172 >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete --exclude='.git*' --exclude='node_modules' --exclude='.env' -e "ssh -o StrictHostKeyChecking=no" ./ root@161.97.75.172:/var/www/smartfinance

      - name: Run composer install on server
        run: |
          ssh -o StrictHostKeyChecking=no root@161.97.75.172 "cd /var/www/smartfinance && composer install --no-dev --optimize-autoloader --ignore-platform-reqs"

      - name: Run migrations on server
        run: |
          ssh -o StrictHostKeyChecking=no root@161.97.75.172 "cd /var/www/smartfinance && php artisan migrate --force"

      - name: Fix permissions on server
        run: |
          ssh -o StrictHostKeyChecking=no root@161.97.75.172 "
            sudo chown -R www-data:www-data /var/www/smartfinance/storage /var/www/smartfinance/bootstrap/cache &&
            sudo chmod -R 775 /var/www/smartfinance/storage /var/www/smartfinance/bootstrap/cache
          "

      - name: Clear and cache configs on server
        run: |
          ssh -o StrictHostKeyChecking=no root@161.97.75.172 "
            cd /var/www/smartfinance &&
            php artisan config:clear &&
            php artisan cache:clear &&
            php artisan route:clear &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan view:cache
          "
